schema: https://api.sandbox.meru.host/graphql
# documents lets IDE GraphQL tooling resolve fragments across files; the
# generated client-preset output is excluded (huge + not source documents).
documents:
  - "src/**/*.{ts,tsx}"
  - "!src/lib/api/gql/**"
extensions:
  customDirectives:
    - "directive @connection(key: String!, filters: [String]) on FIELD"
  codegen:
    generates:
      "schema.graphql":
        config:
          includeDirectives: true
        plugins:
          - schema-ast
      "__schema__/schema.json":
        plugins:
          - introspection
      "src/types/graphql-schema.d.ts":
        config:
          defaultScalarType: string
          enumsAsTypes: true
          futureProofEnums: true
          futureProofUnions: true
          scalars:
            JSON: any
            Slug: string
            UploadID: string
            ISO8601Date: string
            ISO8601DateTime: string
          useTypeImports: true
        plugins:
          - typescript
          - typescript-resolvers
